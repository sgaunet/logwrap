---
version: 2
before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    dir: cmd/logwrap
    id: logwrap
    binary: logwrap

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: ["binary"]

checksum:
  name_template: 'checksums.txt'

dockers:
  # https://goreleaser.com/customization/docker/
  - use: buildx
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-amd64"
      - "ghcr.io/sgaunet/{{ .ProjectName }}:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    # extra_files:
    # - src
    # - resources

  - use: buildx
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-arm64v8"
      - "ghcr.io/sgaunet/{{ .ProjectName }}:latest-arm64v8"
    build_flag_templates:
      - "--platform=linux/arm64/v8"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    # extra_files:
    # - src
    # - resources

  - use: buildx
    goos: linux
    goarch: arm
    goarm: 6
    image_templates:
      - "ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-armv6"
      - "ghcr.io/sgaunet/{{ .ProjectName }}:latest-armv6"
    build_flag_templates:
      - "--platform=linux/arm/v6"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    # extra_files:
    # - src
    # - resources

  - use: buildx
    goos: linux
    goarch: arm
    goarm: 7
    image_templates:
      - "ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-armv7"
      - "ghcr.io/sgaunet/{{ .ProjectName }}:latest-armv7"
    build_flag_templates:
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    # extra_files:
    # - src
    # - resources

docker_manifests:
  # https://goreleaser.com/customization/docker_manifest/
  - name_template: ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}
    image_templates:
      - ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-amd64
      - ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-arm64v8
      - ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-armv6
      - ghcr.io/sgaunet/{{ .ProjectName }}:{{ .Version }}-armv7
  - name_template: ghcr.io/sgaunet/{{ .ProjectName }}:latest
    image_templates:
      - ghcr.io/sgaunet/{{ .ProjectName }}:latest-amd64
      - ghcr.io/sgaunet/{{ .ProjectName }}:latest-arm64v8
      - ghcr.io/sgaunet/{{ .ProjectName }}:latest-armv6
      - ghcr.io/sgaunet/{{ .ProjectName }}:latest-armv7


changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew cask publishing (replaces the deprecated `brews:` block; casks are
# what GoReleaser supports going forward)
homebrew_casks:
  - name: logwrap
    homepage: 'https://github.com/sgaunet/logwrap'
    description: 'Command wrapper that adds configurable prefixes to stdout and stderr'

    # Tap repository directory (casks live in Casks/, not Formula/)
    directory: Casks

    # Command name users invoke, mapped from the artifact name.
    binaries:
      - logwrap

    # Download URL of the release artifact.
    url:
      template: 'https://github.com/sgaunet/logwrap/releases/download/{{ .Tag }}/{{ .ArtifactName }}'

    # Strip the Gatekeeper quarantine xattr so the installed binary can run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

    commit_author:
      name: sgaunet
      email: 1552102+sgaunet@users.noreply.github.com

    repository:
      owner: sgaunet
      name: homebrew-tools
      # Token with 'repo' scope is required for pushing to a different repository
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'

